name: waiter_app
description: "CommonTable waiter app."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  battery_plus: ^6.2.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/theme/config.json
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  min_sdk_android: 21